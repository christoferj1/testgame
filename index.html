<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testgame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0f1a;
      color: #ffffff;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #e0e0ff;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #8888aa;
      margin-bottom: 3rem;
    }

    .qr-placeholder {
      width: 180px;
      height: 180px;
      background: #1e1e30;
      border: 2px dashed #444466;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555577;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Testgame</h1>
  <p>Soon to come</p>
  <div class="qr-placeholder">QR code coming soon</div>
</body>
</html>
