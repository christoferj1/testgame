<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Testgame — Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #b8e4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #1a3a4a;
      overflow: hidden;
    }

    #back {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.7);
      border: 1px solid #88ccdd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #1a3a4a;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    #back:hover { background: rgba(255,255,255,0.95); }

    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    #hud {
      display: flex;
      gap: 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #1a3a4a;
    }

    #hud span { color: #0077aa; }

    #board {
      border: 3px solid #66aac8;
      border-radius: 8px;
      display: block;
      background: #cceeff;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.94);
      border: 2px solid #66aac8;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      z-index: 10;
      min-width: 200px;
    }
    #message h2 { font-size: 1.5rem; margin-bottom: 6px; color: #1a3a4a; }
    #message p  { color: #557788; font-size: 0.9rem; margin-bottom: 16px; }

    button {
      background: #3399bb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s;
    }
    button:hover { background: #2288aa; }

    /* D-pad — star/cross pattern: up top-center, left mid-left, center empty, right mid-right, down bot-center */
    #controls {
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 6px;
      margin-top: 4px;
    }
    #controls button {
      width: 64px; height: 64px;
      font-size: 1.4rem;
      padding: 0;
      border-radius: 14px;
      background: rgba(0,120,170,0.18);
      color: #1a3a4a;
      border: 2px solid #88ccdd;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #controls button:active { background: rgba(0,120,170,0.35); }
    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

<a id="back" href="index.html">← Games</a>

<div id="game-wrapper">
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="board"></canvas>
    <div id="message">
      <h2>🍓 SNAKE</h2>
      <p>Arrow keys or D-pad to move</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
</div>

<div id="controls">
  <button id="btn-up">▲</button>
  <button id="btn-left">◀</button>
  <button id="btn-down">▼</button>
  <button id="btn-right">▶</button>
</div>

<script>
const COLS = 20, ROWS = 20, SZ = 20;
const canvas = document.getElementById('board');
canvas.width  = COLS * SZ;
canvas.height = ROWS * SZ;
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, score, best, speed, running, gameInterval;
best = parseInt(localStorage.getItem('snakeBest') || '0');
document.getElementById('best').textContent = best;

// ── Strawberry drawing ───────────────────────────────────────────────────────
function drawStrawberry(cx, cy, r) {
  // Body (red)
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
  ctx.fillStyle = '#e8274b';
  ctx.fill();
  // Shine
  ctx.beginPath();
  ctx.arc(cx - r * 0.25, cy - r * 0.2, r * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
  // Seeds
  ctx.fillStyle = '#fff0c0';
  const seeds = [{x:-0.2,y:0},{x:0.2,y:0},{x:0,y:0.25},{x:-0.25,y:0.3},{x:0.25,y:0.3}];
  seeds.forEach(s => {
    ctx.beginPath();
    ctx.arc(cx + s.x * r * 1.4, cy + s.y * r * 1.4 + r * 0.1, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  });
  // Leaves (green)
  ctx.fillStyle = '#44bb44';
  ctx.beginPath();
  ctx.ellipse(cx,       cy - r * 0.75, r * 0.18, r * 0.45, 0,           0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.35, cy - r * 0.6, r * 0.15, r * 0.38, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.35, cy - r * 0.6, r * 0.15, r * 0.38,  0.5, 0, Math.PI * 2);
  ctx.fill();
}

function spawnFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function startGame() {
  snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
  score   = 0;
  speed   = 150;
  running = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('message').style.display = 'none';
  spawnFood();
  clearInterval(gameInterval);
  gameInterval = setInterval(tick, speed);
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
    }
    // Speed up every 5 strawberries
    if (score % 5 === 0) {
      speed = Math.max(60, speed - 10);
      clearInterval(gameInterval);
      gameInterval = setInterval(tick, speed);
    }
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  // Background grid
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#cceeff' : '#bbddf0';
      ctx.fillRect(c * SZ, r * SZ, SZ, SZ);
    }
  }

  // Food (strawberry)
  const fx = food.x * SZ + SZ / 2;
  const fy = food.y * SZ + SZ / 2;
  drawStrawberry(fx, fy, SZ * 0.42);

  // Snake
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const x = seg.x * SZ, y = seg.y * SZ;
    const r = isHead ? 7 : 5;

    // Body segment
    ctx.beginPath();
    ctx.roundRect(x + 1, y + 1, SZ - 2, SZ - 2, r);
    ctx.fillStyle = isHead ? '#f8a0b8' : '#f4b8cc';
    ctx.fill();

    // Slight outline
    ctx.strokeStyle = '#d47090';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (isHead) {
      // Eyes
      const ex = dir.x, ey = dir.y;
      const eyeOffX = ey !== 0 ? 5 : 0;
      const eyeOffY = ex !== 0 ? 5 : 0;
      const eyeCX = x + SZ/2 + ex * 4;
      const eyeCY = y + SZ/2 + ey * 4;
      [[eyeCX - eyeOffX, eyeCY - eyeOffY],[eyeCX + eyeOffX, eyeCY + eyeOffY]].forEach(([ex2, ey2]) => {
        ctx.beginPath();
        ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#7a2040';
        ctx.fill();
      });
    }
  });
}

function gameOver() {
  running = false;
  clearInterval(gameInterval);
  const msg = document.getElementById('message');
  msg.innerHTML = `<h2>Game Over!</h2><p>Score: ${score}${score > 0 ? ' 🍓' : ''}</p><button id="start-btn">Play Again</button>`;
  msg.style.display = 'block';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ── Keyboard ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!running) return;
  const map = {
    ArrowUp:    {x:0,y:-1}, ArrowDown:  {x:0,y:1},
    ArrowLeft:  {x:-1,y:0}, ArrowRight: {x:1,y:0}
  };
  const d = map[e.key];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) { e.preventDefault(); nextDir = d; }
});

// ── Touch D-pad ─────────────────────────────────────────────────────────────
function addDir(id, d) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    if (running && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }, { passive: false });
  el.addEventListener('click', () => {
    if (running && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  });
}
addDir('btn-up',    {x:0,y:-1});
addDir('btn-down',  {x:0,y:1});
addDir('btn-left',  {x:-1,y:0});
addDir('btn-right', {x:1,y:0});

document.getElementById('start-btn').addEventListener('click', startGame);
</script>
</body>
</html>
