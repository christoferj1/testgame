<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Testgame — Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #e8d5b0;
      overflow: hidden;
    }

    /* Leaf canvas behind everything */
    #leaves {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #back {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(20,40,55,0.85);
      border: 1px solid #5a7a6a;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #1a3a4a;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    #back:hover { background: rgba(30,60,70,0.95); }
    #back { color: #e8d5b0; text-decoration: none; }

    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
      max-width: 100vw;
      padding: 0 4px;
    }

    #hud {
      display: flex;
      gap: 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #e8d5b0;
    }

    #hud span { color: #e8a030; }

    #board {
      border: 3px solid #3a5a4a;
      border-radius: 8px;
      display: block;
      background: #1e3828;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,30,25,0.95);
      border: 2px solid #5a7a4a;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      z-index: 10;
      min-width: 200px;
    }
    #message h2 { font-size: 1.5rem; margin-bottom: 6px; color: #e8d5b0; }
    #message p  { color: #a09070; font-size: 0.9rem; margin-bottom: 16px; }

    button {
      background: #8b5a1a;
      color: #f5e8d0;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s;
    }
    button:hover { background: #a06820; }

    /* D-pad — star/cross pattern: up top-center, left mid-left, center empty, right mid-right, down bot-center */
    #controls {
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 6px;
      margin-top: 4px;
    }
    #controls button {
      width: 64px; height: 64px;
      font-size: 1.4rem;
      padding: 0;
      border-radius: 14px;
      background: rgba(80,50,10,0.35);
      color: #e8d5b0;
      border: 2px solid #7a5a2a;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #controls button:active { background: rgba(120,70,10,0.55); }
    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

<a id="back" href="index.html">← Games</a>

<canvas id="leaves"></canvas>

<div id="game-wrapper">
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="board"></canvas>
    <div id="message">
      <h2>🍓 SNAKE</h2>
      <p>Arrow keys or D-pad to move</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
</div>

<div id="controls">
  <button id="btn-up">▲</button>
  <button id="btn-left">◀</button>
  <button id="btn-down">▼</button>
  <button id="btn-right">▶</button>
</div>

<script>
const COLS = 20, ROWS = 20;
// Fit board inside the screen with a small margin for the border
const SZ = Math.min(20, Math.floor((Math.min(window.innerWidth, 420) - 8) / COLS));
const canvas = document.getElementById('board');
canvas.width  = COLS * SZ;
canvas.height = ROWS * SZ;
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, score, best, speed, running, gameInterval;
best = parseInt(localStorage.getItem('snakeBest') || '0');
document.getElementById('best').textContent = best;

// ── Strawberry drawing ───────────────────────────────────────────────────────
function drawStrawberry(cx, cy, r) {
  // Body (red)
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
  ctx.fillStyle = '#e8274b';
  ctx.fill();
  // Shine
  ctx.beginPath();
  ctx.arc(cx - r * 0.25, cy - r * 0.2, r * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
  // Seeds
  ctx.fillStyle = '#fff0c0';
  const seeds = [{x:-0.2,y:0},{x:0.2,y:0},{x:0,y:0.25},{x:-0.25,y:0.3},{x:0.25,y:0.3}];
  seeds.forEach(s => {
    ctx.beginPath();
    ctx.arc(cx + s.x * r * 1.4, cy + s.y * r * 1.4 + r * 0.1, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  });
  // Leaves (green)
  ctx.fillStyle = '#44bb44';
  ctx.beginPath();
  ctx.ellipse(cx,       cy - r * 0.75, r * 0.18, r * 0.45, 0,           0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.35, cy - r * 0.6, r * 0.15, r * 0.38, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.35, cy - r * 0.6, r * 0.15, r * 0.38,  0.5, 0, Math.PI * 2);
  ctx.fill();
}

function randomCell(exclude) {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    (exclude && exclude.x === pos.x && exclude.y === pos.y)
  );
  return pos;
}

function spawnFood() { food = randomCell(apple); }

// Apple: spawns randomly, max one active at a time, at most once per 5 strawberries eaten
let apple = null;          // current apple position (null = none)
let nextAppleAt = 5;       // score threshold for the next possible apple spawn

function maybeSpawnApple() {
  if (apple) return;                            // one already on board
  if (score < nextAppleAt) return;             // not earned yet
  if (Math.random() < 0.5) {                   // 50% chance each time eligible
    apple = randomCell(food);
    nextAppleAt = score + 5;                   // next earliest at +5 more strawberries
  } else {
    nextAppleAt = score + 1;                   // retry next strawberry
  }
}

function drawApple(cx, cy, r) {
  // Body
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.05, r * 0.88, 0, Math.PI * 2);
  ctx.fillStyle = '#e02020';
  ctx.fill();
  // Shine
  ctx.beginPath();
  ctx.arc(cx - r * 0.28, cy - r * 0.25, r * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fill();
  // Stem
  ctx.beginPath();
  ctx.moveTo(cx, cy - r * 0.85);
  ctx.lineTo(cx + r * 0.2, cy - r * 1.3);
  ctx.strokeStyle = '#5a3010';
  ctx.lineWidth = r * 0.18;
  ctx.stroke();
  // Leaf
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.3, cy - r * 1.15, r * 0.28, r * 0.14, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#44aa22';
  ctx.fill();
}

function startGame() {
  snake      = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir        = {x:1, y:0};
  nextDir    = {x:1, y:0};
  score      = 0;
  speed      = 200;
  running    = true;
  apple      = null;
  nextAppleAt = 5;
  document.getElementById('score').textContent = '0';
  document.getElementById('message').style.display = 'none';
  spawnFood();
  clearInterval(gameInterval);
  gameInterval = setInterval(tick, speed);
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
    }
    // Speed up every 5 strawberries
    if (score % 5 === 0) {
      speed = Math.max(90, speed - 10);
      clearInterval(gameInterval);
      gameInterval = setInterval(tick, speed);
    }
    spawnFood();
    maybeSpawnApple();
  } else if (apple && head.x === apple.x && head.y === apple.y) {
    // Eating apple — grows snake but doesn't increment score or speed
    apple = null;
  } else {
    snake.pop();
  }

  // Apple expires after 15 seconds (removed silently)
  draw();
}

function draw() {
  // Background grid — dark forest tones
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#1e3828' : '#1a3224';
      ctx.fillRect(c * SZ, r * SZ, SZ, SZ);
    }
  }

  // Food (strawberry)
  const fx = food.x * SZ + SZ / 2;
  const fy = food.y * SZ + SZ / 2;
  drawStrawberry(fx, fy, SZ * 0.42);

  // Apple (bonus)
  if (apple) {
    const ax = apple.x * SZ + SZ / 2;
    const ay = apple.y * SZ + SZ / 2;
    drawApple(ax, ay, SZ * 0.42);
  }

  // Snake
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const x = seg.x * SZ, y = seg.y * SZ;
    const r = isHead ? 7 : 5;

    // Body segment
    ctx.beginPath();
    ctx.roundRect(x + 1, y + 1, SZ - 2, SZ - 2, r);
    ctx.fillStyle = isHead ? '#f8a0b8' : '#f4b8cc';
    ctx.fill();

    // Slight outline
    ctx.strokeStyle = '#d47090';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (isHead) {
      // Eyes
      const ex = dir.x, ey = dir.y;
      const eyeOffX = ey !== 0 ? 5 : 0;
      const eyeOffY = ex !== 0 ? 5 : 0;
      const eyeCX = x + SZ/2 + ex * 4;
      const eyeCY = y + SZ/2 + ey * 4;
      [[eyeCX - eyeOffX, eyeCY - eyeOffY],[eyeCX + eyeOffX, eyeCY + eyeOffY]].forEach(([ex2, ey2]) => {
        ctx.beginPath();
        ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#7a2040';
        ctx.fill();
      });
    }
  });
}

function gameOver() {
  running = false;
  clearInterval(gameInterval);
  const msg = document.getElementById('message');
  msg.innerHTML = `<h2>Game Over!</h2><p>Score: ${score}${score > 0 ? ' 🍓' : ''}</p><button id="start-btn">Play Again</button>`;
  msg.style.display = 'block';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ── Keyboard ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!running) return;
  const map = {
    ArrowUp:    {x:0,y:-1}, ArrowDown:  {x:0,y:1},
    ArrowLeft:  {x:-1,y:0}, ArrowRight: {x:1,y:0}
  };
  const d = map[e.key];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) { e.preventDefault(); nextDir = d; }
});

// ── Touch D-pad ─────────────────────────────────────────────────────────────
function addDir(id, d) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    if (running && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }, { passive: false });
  el.addEventListener('click', () => {
    if (running && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  });
}
addDir('btn-up',    {x:0,y:-1});
addDir('btn-down',  {x:0,y:1});
addDir('btn-left',  {x:-1,y:0});
addDir('btn-right', {x:1,y:0});

document.getElementById('start-btn').addEventListener('click', startGame);

// ── Autumn leaf background ───────────────────────────────────────────────────
const leafCanvas = document.getElementById('leaves');
const lCtx = leafCanvas.getContext('2d');

const LEAF_COLORS = [
  '#c0392b', '#e74c3c', '#e67e22', '#f39c12',
  '#d35400', '#a04000', '#8e6030', '#c07a20',
  '#6b8e23', '#556b2f'
];

function drawLeaf(ctx, x, y, size, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.globalAlpha = 0.55;
  // Leaf shape: two bezier curves forming an oval leaf
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo( size * 0.8, -size * 0.5,  size * 0.8,  size * 0.5, 0,  size);
  ctx.bezierCurveTo(-size * 0.8,  size * 0.5, -size * 0.8, -size * 0.5, 0, -size);
  ctx.fillStyle = color;
  ctx.fill();
  // Midrib
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(0,  size);
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = size * 0.12;
  ctx.stroke();
  ctx.restore();
}

function drawLeaves() {
  leafCanvas.width  = window.innerWidth;
  leafCanvas.height = window.innerHeight;
  lCtx.clearRect(0, 0, leafCanvas.width, leafCanvas.height);
  // Seed random with fixed value so layout stays consistent
  let s = 42;
  function rng() { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; }
  const count = Math.floor((leafCanvas.width * leafCanvas.height) / 14000);
  for (let i = 0; i < count; i++) {
    const x     = rng() * leafCanvas.width;
    const y     = rng() * leafCanvas.height;
    const size  = rng() * 12 + 6;
    const angle = rng() * Math.PI * 2;
    const color = LEAF_COLORS[Math.floor(rng() * LEAF_COLORS.length)];
    drawLeaf(lCtx, x, y, size, angle, color);
  }
}

drawLeaves();
window.addEventListener('resize', drawLeaves);
</script>
</body>
</html>
